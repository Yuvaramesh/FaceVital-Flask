services:
  - type: web
    name: facevital-flask
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      apt-get update
      apt-get install -y gfortran libopenblas-dev liblapack-dev
      pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --logger.level=error --client.showErrorDetails=false
